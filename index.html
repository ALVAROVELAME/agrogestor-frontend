<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0F3A24" />

    <!-- SEO -->
    <title>AgroGestor | Gestão de rebanho leiteiro simples e sem planilhas</title>
    <meta
      name="description"
      content="Cadastre animais por brinco, acompanhe a produção de leite e gere relatórios do rebanho em um painel que abre no celular. Comece grátis com o AgroGestor."
    />
    <meta
      name="keywords"
      content="gestão de rebanho, software para pecuária leiteira, controle de produção de leite, cadastro de animais, brinco, agrotech, AgroGestor"
    />
    <meta name="author" content="Álvaro Velame" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://agrogestor.vercel.app/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroGestor" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://agrogestor.vercel.app/" />
    <meta property="og:title" content="AgroGestor | Gestão de rebanho leiteiro simples e sem planilhas" />
    <meta
      property="og:description"
      content="Saiba quanto cada vaca produz. Cadastro por brinco, painel do dia e relatórios do rebanho em um só lugar."
    />
    <meta property="og:image" content="https://agrogestor.vercel.app/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Painel do AgroGestor mostrando a produção de leite do rebanho" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgroGestor | Gestão de rebanho leiteiro simples e sem planilhas" />
    <meta
      name="twitter:description"
      content="Saiba quanto cada vaca produz. Cadastro por brinco, painel do dia e relatórios do rebanho em um só lugar."
    />
    <meta name="twitter:image" content="https://agrogestor.vercel.app/og-preview.png" />
    <meta name="twitter:image:alt" content="Painel do AgroGestor mostrando a produção de leite do rebanho" />

    <!-- Dados estruturados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AgroGestor",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Plataforma web para gestão de rebanho leiteiro: cadastro por brinco, controle de produção e relatórios.",
        "inLanguage": "pt-BR",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
        "author": {
          "@type": "Person",
          "name": "Álvaro Velame",
          "url": "https://alvarovelame.vercel.app"
        }
      }
    </script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Para usar o AgroGestor, ative o JavaScript no seu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
